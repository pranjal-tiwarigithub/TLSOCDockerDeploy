name: CI - Python & Bash Tests

on:
  push:
    branches: [hardening, main]
  pull_request:
    branches: [hardening, main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run Python tests
        run: |
          if [ -d tests ] || ls test_*.py 2>/dev/null; then
            pytest
          else
            echo "No Python tests found yet – skipping"
          fi

  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on bash scripts
        run: |
          if find . -name "*.sh" | grep -q .; then
            find . -name "*.sh" -print0 | xargs -0 shellcheck
          else
            echo "No .sh files found – skipping ShellCheck"
          fi
