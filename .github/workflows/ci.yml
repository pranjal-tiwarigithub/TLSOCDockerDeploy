  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on bash scripts
        run: |
          echo "Running ShellCheck (warnings only, not failing on style/info)..."
          if find . -name "*.sh" | grep -q .; then
            find . -name "*.sh" -print0 | xargs -0 shellcheck --severity=error || true
            echo "ShellCheck finished (only real errors would fail the job)"
          else
            echo "No .sh files found – skipping ShellCheck"
          fi
